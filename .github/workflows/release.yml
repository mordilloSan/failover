# A merged PR from dev/vX.Y.Z → tests, then the image on GHCR and the binary
# on the release. The tag vX.Y.Z is made on the merge commit and the release
# notes are the PR's text. Releases go only through gh-release-flow: a tag
# pushed by hand publishes nothing.
# The TNAS only pulls ghcr.io/mordillosan/failover-agent; nothing is built there.
name: release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch: # a manual run on a branch publishes the image tagged with the branch, no release

permissions:
  checks: read
  contents: write
  packages: write
  pull-requests: read

env:
  IMAGE: ghcr.io/mordillosan/failover-agent

jobs:
  release:
    # Only merged release PRs from this repository: forks cannot publish. A manual run
    # on a branch publishes only the image; a manual run on a tag publishes nothing.
    if: >-
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/')) ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dev/v'))
    # On the job, not the workflow: every closed PR starts this workflow, and a skipped job never joins the group.
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require passing checks
        if: github.event_name == 'pull_request' # a manual run has no PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # This workflow is itself one of the PR's checks, so leave it out.
          checks=$(gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json bucket,workflow)
          jq -e --arg self "$GITHUB_WORKFLOW" '[.[] | select(.workflow != $self)] |
            length > 0 and all(.[]; .bucket == "pass" or .bucket == "skipping")' <<< "$checks"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # credentials kept: the Binário step pushes the release tag with git push
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}

      - name: Versão
        id: v
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            v=${HEAD_REF#dev/}
            if [[ ! $v =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::notice::$HEAD_REF não é dev/vX.Y.Z: sem release"
              echo "skip=true" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            # a tag already on another commit is an error; on this one, a re-run of a release that failed
            if sha=$(git ls-remote --tags origin "refs/tags/$v" | cut -f1) && [[ -n $sha && $sha != "$(git rev-parse HEAD)" ]]; then
              echo "::error::a tag $v já existe noutro commit"
              exit 1
            fi
          else
            v=${GITHUB_REF_NAME//\//-} # a manual run: the branch, with / (not allowed in an image tag) as -
          fi
          echo "version=$v" >>"$GITHUB_OUTPUT"

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: steps.v.outputs.skip != 'true'
        with:
          go-version-file: go.mod

      - name: gofmt e go vet
        if: steps.v.outputs.skip != 'true'
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        if: steps.v.outputs.skip != 'true'
        with:
          version: "latest"
          install-mode: goinstall

      - name: Testes
        if: steps.v.outputs.skip != 'true'
        run: go test -race ./...

      - name: Imagem
        if: steps.v.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          tags=(-t "$IMAGE:$VERSION")
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then tags+=(-t "$IMAGE:latest"); fi
          docker build --build-arg "VERSION=$VERSION" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            "${tags[@]}" -f deploy/Dockerfile .
          docker push --all-tags "$IMAGE"

      - name: Binário
        if: steps.v.outputs.skip != 'true' && github.event_name == 'pull_request'
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
          VERSION: ${{ steps.v.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o failover-agent .
          scripts/third-party-notices.sh failover-agent THIRD_PARTY_NOTICES.md
          # Lets a download be checked with: sha256sum -c --ignore-missing SHA256SUMS
          sha256sum -- failover-agent THIRD_PARTY_NOTICES.md >SHA256SUMS
          # the tag only now, after the tests and the image: a failed release leaves none behind
          if ! git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            git tag "$VERSION"
            git push origin "$VERSION"
          fi
          printf '%s\n' "$PR_BODY" > notes.md
          gh release create "$VERSION" failover-agent THIRD_PARTY_NOTICES.md SHA256SUMS \
            --title "$VERSION" --notes-file notes.md
