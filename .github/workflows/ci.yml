# Every PR and every push to a dev/* branch: the same checks as `make lint test`,
# so a warning is caught before the merge and not at the release.
name: ci

on:
  pull_request:
  push:
    branches: ["dev/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: gofmt e go vet
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: "latest"
          install-mode: goinstall

      - name: shellcheck
        run: shellcheck e2e/run.sh

      - name: Testes
        run: go test -race ./...
