# Criado assim no primeiro arranque, se não existir. A interface reescreve-o ao
# guardar (os comentários perdem-se). O login da interface fica em user.yml.

mode: observe                 # observe: só regista o que faria · auto: age
server:
  ip: 192.168.1.66                     # IP do servidor
  npm_check_host: nginx.engmariz.com   # URL do NPM no servidor
tnas_ip: 192.168.1.249                 # IP da NAS
router_ip: 192.168.1.1                 # IP da Gateway
lan_iface: ovs_eth0                    # interface do arping (R3)
check_interval_s: 60
start_timeout_min: 10                  # a cópia tem este tempo para ficar saudável, senão ERROR

paths:
  mirror_subvol: /Volume1/ServerBackup
  mirror_root: homelab
  snapshots_dir: /Volume1/Docker/failover-snapshots   # failover-<svc>-<timestamp>
  overrides_dir: /Volume1/Docker/failover/overrides

npm:
  dir: npm
  alert_after_min: 3                   # 2.3

services: []                           # a descoberta propõe-nos na interface

maintenance:
  default_expiry_min: 60

dns:
  api_url: https://127.0.0.1:53443     # o HTTPS do Technitium; em loopback aceita-se o certificado auto-assinado
  token_file: /config/technitium.token
  zone: engmariz.com
  ttl: 60


email:                                 # avisos: em Definições → Avisos (Gmail: password de aplicação)
  host: ""                             # vazio: sem avisos (Gmail: smtp.gmail.com)
  port: 587
  security: starttls                   # starttls (587) · tls (465) · none (relay na LAN, sem login)
  user: ""
  password: ""
  from: ""                             # vazio: o utilizador
  to: ""                               # vazio: o utilizador

nightly:
  prepull_at: "05:00"                  # depois do espelho das 04:30, e ao arrancar; "" desliga

ui:
  listen: 0.0.0.0:8099                 # no primeiro acesso cria-se a conta de administrador
