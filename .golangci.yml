# From LinuxIO's backend/.golangci.yml, without the linters and settings for
# code this repo does not have (SQL, testify, protobuf, cobra).
version: "2"
linters:
  settings:
    staticcheck:
      checks:
        - all
        - "-QF1001"
        - "-ST1003"
        - "-ST1016"
        - "-QF1004"
        - "-QF1003"
        - "-SA4006"
    cyclop:
      max-complexity: 30
      package-average: 10
    errcheck:
      check-type-assertions: true
    gocognit:
      min-complexity: 20
    gocritic:
      settings:
        captLocal:
          paramsOnly: false
        underef:
          skipRecvDeref: false
    govet:
      disable:
        - fieldalignment
      enable-all: true
      settings:
        shadow:
          strict: false
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-no-explanation:
        - funlen
        - gocognit
        - lll
    unused:
      field-writes-are-uses: true
      post-statements-are-reads: true
      exported-fields-are-used: true
      parameters-are-used: true
      local-variables-are-used: true
      generated-is-used: true
  enable:
    - bodyclose
    - cyclop
    - durationcheck
    - gocognit
    - gocritic
    - makezero
    - nilnesserr
    - nolintlint
    - unconvert
    - unused
    - usestdlibvars
    - wastedassign
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - bodyclose
          - dupl
          - funlen
          - goconst
          - gosec
          - noctx
          - wrapcheck
        path: _test\.go
issues:
  max-same-issues: 50
formatters:
  settings:
    gofmt:
      simplify: true
    gci:
      custom-order: true
      sections:
        - standard
        - default
        - prefix(github.com/mordilloSan/failover)
  enable:
    - gofmt
    - gci
